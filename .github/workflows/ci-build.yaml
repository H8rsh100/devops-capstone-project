name: ci-build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: python:3.9

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint the code with flake8
        run: |
          flake8 service tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 service tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run unit tests with nosetests
        env:
          DATABASE_URI: sqlite:///test.db
        run: |
          nosetests -v --with-spec --spec-color tests
          coverage run -m nose tests
          coverage report -m
